# Viamind regression corpus: openly licensed KiCad projects, pinned by commit.
# Design files are never committed here; scripts/fetch-corpus.sh fetches them
# into corpus/cache/<name>/. See corpus/README.md for the field reference.
#
# Facts below were checked against GitHub and the fetched files on 2026-10-10:
# licence = the repo's GitHub licence field or its LICENSE file (SPDX id);
# kicad_version = major version that last saved the .kicad_pcb;
# copper_layers / sheets = counted from the board and the schematic hierarchy.

schema = 1

