[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RL-Charles/viamind"

[workspace.dependencies]
viamind-core = { path = "crates/viamind-core" }
viamind-schematic = { path = "crates/viamind-schematic" }
viamind-pcb = { path = "crates/viamind-pcb" }
