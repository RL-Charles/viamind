[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RL-Charles/viamind"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Default clippy groups (correctness, suspicious, style, complexity, perf).
all = { level = "warn", priority = -1 }
# Leftovers that must not reach main.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Pedantic lints that catch real issues without fighting normal code.
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
# Command structs and egui widgets legitimately take many arguments and nested types.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
epaint_default_fonts = "=0.36.2"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
base64 = "0.22"
png = "0.18"
quick-xml = "0.41"
viamind-geom = { path = "crates/geom" }
viamind-doc = { path = "crates/doc" }
viamind-engine = { path = "crates/engine" }
viamind-render = { path = "crates/render" }
viamind-mcp = { path = "crates/mcp" }
viamind-ui-egui = { path = "crates/ui-egui" }
viamind-router = { path = "crates/router" }
viamind-drc = { path = "crates/drc" }
viamind-fab = { path = "crates/fab" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
tempfile = "3"
rustix = { version = "1.1.5", features = ["fs"] }
# Agent harness (crates/mcp)
rmcp = { version = "=3.5.1", default-features = false }
tokio = "1.53"
anyhow = "1.0"
thiserror = "2.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
earcutr = "0.5"
# Model and engine (crates/doc, crates/engine)
uuid = { version = "1.28", features = ["v4", "serde"] }
schemars = { version = "1.2", features = ["uuid1"] }
# Geometry (crates/geom)
rstar = "0.13"
criterion = "0.8"
i_overlay = "9"
geo = { version = "0.33", default-features = false }
