[package]
name = "viamind-ui-egui"
description = "Viamind desktop UI built on egui and eframe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
earcutr.workspace = true
viamind-engine.workspace = true
viamind-doc.workspace = true
viamind-geom.workspace = true
serde_json.workspace = true
viamind-render.workspace = true
egui.workspace = true
# wgpu renderer with native Wayland and X11 on Linux. `default-features = false` like the ArtCraft
# Craft apps (CADCraft), so only the features Viamind uses are compiled.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }

[dev-dependencies]
tempfile.workspace = true
viamind-mcp.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
egui_kittest.workspace = true
