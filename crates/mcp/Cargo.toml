[package]
name = "viamind-mcp"
description = "Viamind agent harness: MCP server exposing every engine command to agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "viamind-mcp"
path = "src/bin/viamind-mcp.rs"

[dependencies]
viamind-drc.workspace = true
viamind-engine.workspace = true
viamind-fab.workspace = true
serde.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "net"] }
axum.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
viamind-doc.workspace = true
